  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin */\n@font-face {\n  font-family: 'Oswald';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"6db02c17-df4a-4b11-b582-b929f3d5c717\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin */\n@font-face {\n  font-family: 'Oswald';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"6db02c17-df4a-4b11-b582-b929f3d5c717\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin */\n@font-face {\n  font-family: 'Oswald';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"6db02c17-df4a-4b11-b582-b929f3d5c717\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin */\n@font-face {\n  font-family: 'Oswald';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"6db02c17-df4a-4b11-b582-b929f3d5c717\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n  \n\n  <style>\n    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\n    :root {\n      --y:     #F0B800;\n      --yd:    #D9A400;\n      --blk:   #0C0C0C;\n      --d1:    #131313;\n      --d2:    #1A1A1A;\n      --d3:    #222222;\n      --wh:    #FFFFFF;\n      --mu:    rgba(255,255,255,0.5);\n      --mu2:   rgba(255,255,255,0.28);\n      --rule:  rgba(255,255,255,0.07);\n    }\n\n    html { scroll-behavior: smooth; }\n\n    body {\n      font-family: 'Barlow', sans-serif;\n      background: var(--blk);\n      color: var(--wh);\n      line-height: 1.5;\n      overflow-x: hidden;\n    }\n\n    /* ──────────────── NAV ──────────────── */\n    .nav {\n      position: fixed;\n      top: 0; left: 0; right: 0;\n      z-index: 500;\n      height: 68px;\n      padding: 0 48px;\n      display: grid;\n      grid-template-columns: 1fr auto 1fr;\n      align-items: center;\n      gap: 24px;\n      background: rgba(12,12,12,0.88);\n      backdrop-filter: blur(14px);\n      -webkit-backdrop-filter: blur(14px);\n      border-bottom: 1px solid rgba(255,255,255,0.05);\n    }\n    .nav::after {\n      content: '';\n      position: absolute;\n      bottom: 0; left: 0; right: 0;\n      height: 2px;\n      background: var(--y);\n    }\n\n    .nav-logo img { height: 44px; display: block; }\n\n    .nav-links {\n      display: flex;\n      gap: 28px;\n      list-style: none;\n      justify-content: center;\n    }\n    .nav-links a {\n      color: rgba(255,255,255,0.52);\n      font-size: 12px;\n      font-weight: 600;\n      letter-spacing: 0.1em;\n      text-transform: uppercase;\n      text-decoration: none;\n      white-space: nowrap;\n      transition: color 0.15s;\n    }\n    .nav-links a:hover { color: var(--y); }\n\n    .nav-right {\n      display: flex;\n      align-items: center;\n      gap: 16px;\n      justify-content: flex-end;\n    }\n    .nav-phone {\n      color: rgba(255,255,255,0.3);\n      font-size: 12px;\n      font-weight: 500;\n      text-decoration: none;\n      white-space: nowrap;\n      transition: color 0.15s;\n    }\n    .nav-phone:hover { color: var(--wh); }\n    .nav-sep { width: 1px; height: 16px; background: rgba(255,255,255,0.1); flex-shrink: 0; }\n    .nav-quote {\n      color: var(--y);\n      font-size: 12px;\n      font-weight: 700;\n      letter-spacing: 0.12em;\n      text-transform: uppercase;\n      text-decoration: none;\n      white-space: nowrap;\n      transition: opacity 0.15s;\n    }\n    .nav-quote:hover { opacity: 0.7; }\n\n    /* ──────────────── HERO ──────────────── */\n    .hero {\n      position: relative;\n      height: 100vh;\n      min-height: 720px;\n      background: var(--blk);\n      overflow: hidden;\n    }\n\n    /* Giant ghost text — \"STORAGE\" behind everything */\n    .hero-ghost {\n      position: absolute;\n      top: 50%;\n      left: -2%;\n      transform: translateY(-46%);\n      font-family: 'Oswald', sans-serif;\n      font-weight: 700;\n      font-size: clamp(180px, 20vw, 300px);\n      text-transform: uppercase;\n      color: rgba(255,255,255,0.032);\n      letter-spacing: -0.01em;\n      line-height: 0.9;\n      pointer-events: none;\n      white-space: nowrap;\n      z-index: 1;\n      user-select: none;\n    }\n\n    /* Photo area — right 58% */\n    .hero-photo {\n      position: absolute;\n      top: 0; right: 0; bottom: 0;\n      width: 60%;\n      z-index: 2;\n    }\n\n    /* Photo background art */\n    .hero-photo-bg {\n      position: absolute;\n      inset: 0;\n      background: #1a1a1a;\n    }\n\n    /* Left gradient fade — blends photo into dark bg */\n    .hero-photo::before {\n      content: '';\n      position: absolute;\n      inset: 0;\n      background: linear-gradient(90deg,\n        var(--blk) 0%,\n        rgba(12,12,12,0.45) 22%,\n        rgba(12,12,12,0.05) 50%,\n        transparent 100%);\n      z-index: 4;\n    }\n\n    /* Vertical panel strips — decorative lines over photo */\n    .hero-photo-strips {\n      position: absolute;\n      inset: 0;\n      z-index: 3;\n      background-image: repeating-linear-gradient(\n        90deg,\n        transparent 0px,\n        transparent 88px,\n        rgba(0,0,0,0.22) 88px,\n        rgba(0,0,0,0.22) 90px\n      );\n    }\n\n    /* Container art in ion: none;\n      transition: color 0.15s;\n    }\n    .cta-secondary:hover { color: rgba(255,255,255,0.7); }\n\n    /* Feature card — bottom left (like reference thumbnail card) */\n    .hero-card {\n      position: absolute;\n      bottom: 48px;\n      left: 80px;\n      z-index: 11;\n      display: flex;\n      align-items: center;\n      gap: 16px;\n      background: rgba(255,255,255,0.05);\n      border: 1px solid rgba(255,255,255,0.09);\n      backdrop-filter: blur(10px);\n      padding: 14px 18px 14px 14px;\n      max-width: 340px;\n    }\n    .hcard-thumb {\n      width: 64px;\n      height: 52px;\n      background: var(--y);\n      flex-shrink: 0;\n      position: relative;\n      overflow: hidden;\n    }\n    .hcard-thumb::before {\n      content: '';\n      position: absolute;\n      inset: 0;\n      background-image: repeating-linear-gradient(\n        90deg,\n        rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 2px,\n        transparent 2px, transparent 18px\n      );\n    }\n    .hcard-thumb::after {\n      content: 'A-VERDI';\n      position: absolute;\n      bottom: 5px; left: 5px;\n      font-family: 'Oswald', sans-serif;\n      font-size: 7px;\n      font-weight: 700;\n      color: rgba(0,0,0,0.4);\n      letter-spacing: 0.1em;\n    }\n    .hcard-text p {\n      color: rgba(255,255,255,0.48);\n      font-size: 11.5px;\n      line-height: 1.55;\n    }\n    .hcard-text a {\n      color: var(--y);\n      font-size: 11px;\n      font-weight: 700;\n      letter-spacing: 0.1em;\n      text-transform: uppercase;\n      text-decoration: none;\n      display: block;\n      margin-top: 5px;\n    }\n\n    /* ──────────────── AUDIENCE PANELS ──────────────── */\n    .a-panel {\n      position: relative;\n      display: grid;\n      min-height: 560px;\n      overflow: hidden;\n      border-top: 1px solid var(--rule);\n    }\n    .a-panel-2col { grid-template-columns: 1fr 1fr; }\n\n    /* Section ghost number */\n    .ap-ghost {\n      position: absolute;\n      font-family: 'Oswald', sans-serif;\n      font-weight: 700;\n      font-size: clamp(200px, 22vw, 340px);\n      color: rgba(255,255,255,0.03);\n      line-height: 1;\n      pointer-events: none;\n      z-index: 1;\n      user-select: none;\n    }\n    .ap-ghost-tr { top: -20px; right: -10px; }\n    .ap-ghost-tl { top: -20px; left: -10px; }\n\n    .ap-bg-1 { background: linear-gradient(160deg, #181810 0%, #222218 60%, #141410 100%); }\n    .ap-bg-2 { background: linear-gradient(160deg, #111418 0%, #18202a 60%, #0e1014 100%); }\n    .ap-bg-3 { background: linear-gradient(160deg, #161614 0%, #202018 60%, #131312 100%); }\n\n    /* Text side */\n    .ap-text {\n      position: relative;\n      z-index: 5;\n      padding: 90px 72px;\n      display: flex;\n      flex-direction: column;\n      justify-content: center;\n    }\n\n    .ap-kicker {\n      font-size: 10.5px;\n      font-weight: 700;\n      letter-spacing: 0.32em;\n      text-transform: uppercase;\n      color: var(--y);\n      margin-bottom: 14px;\n    }\n    .ap-h2 {\n      font-family: 'Oswald', sans-serif;\n      font-weight: 700;\n      font-size: clamp(40px, 4.2vw, 60px);\n      text-transform: uppercase;\n      line-height: 1.0;\n      color: var(--wh);\n      margin-bottom: 28px;\n    }\n    .ap-bullets { list-style: none; margin-bottom: 40px; }\n    .ap-bullets li {\n      font-size: 15px;\n      line-height: 1.68;\n      padding: 5px 0;\n      color: rgba(255,255,255,0.5);\n      display: flex;\n      align-items: baseline;\n      gap: 12px;\n    }\n    .ap-bullets li::before { content: '–'; color: var(--y); font-weight: 700; flex-shrink: 0; }\n\n    /* Photo side */\n    .ap-photo {\n      position: relative;\n      overflow: hidden;\n    }\n    /* Top yellow stripe */\n    .ap-photo::before {\n      content: '';\n      position: absolute;\n      top: 0; left: 0; right: 0;\n      height: 3px;\n      background: var(--y);\n      z-index: 6;\n    }\n    /* Vertical strips */\n    .ap-photo::after {\n      content: '';\n      position: absolute;\n      inset: 0;\n      z-index: 4;\n      background-image: repeating-linear-gradient(\n        90deg,\n        transparent 0px,\n        transparent 72px,\n        rgba(0,0,0,0.2) 72px,\n        rgba(0,0,0,0.2) 74px\n      );\n    }\n    /* Inner gradient fade toward text side */\n    .ap-photo-fade-r {\n      position: absolute;\n      inset: 0;\n      z-index: 5;\n      background: linear-gradient(90deg, transparent 50%, rgba(12,12,12,0.35) 100%);\n    }\n    .ap-photo-fade-l {\n      position: absolute;\n      inset: 0;\n      z-index: 5;\n      background: linear-gradient(90deg, rgba(12,12,12,0.35) 0%, transparent 50%);\n    }\n\n    /* ──────────────── ABOUT ──────────────── */\n    .about {\n      position: relative;\n      background: var(--d1);\n      padding: 110px 80px;\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 100px;\n      align-items: center;\n      overflow: hidden;\n      border-top: 1px solid var(--rule);\n    }\n    .about-ghost {\n      position: absolute;\n      font-family: 'Oswald', sans-serif;\n      font-weight: 700;\n      font-size: clamp(100px, 12vw, 170px);\n      text-transform: uppercase;\n      color: rgba(255,255,255,0.025);\n      pointer-events: none;\n      z-index: 1;\n      line-height: 1;\n      bottom: -20px;\n      right: -10px;\n      user-select: none;\n    }\n    .about-text { position: relative; z-index: 2; }\n    .about-body {\n      color: rgba(255,255,255,0.48);\n      font-size: 15.5px;\n      line-height: 1.78;\n      margin-bottom: 16px;\n    }\n    .badge-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 32px; }\n    .badge {\n      border: 1px solid rgba(255,255,255,0.1);\n      color: rgba(255,255,255,0.52);\n      padding: 10px 18px;\n      font-size: 12px;\n      font-weight: 700;\n      letter-spacing: 0.07em;\n      text-transform: uppercase;\n      display: flex;\n      align-items: center;\n      gap: 8px;\n    }\n    .bdot { width: 5px; height: 5px; background: var(--y); border-radius: 50%; flex-shrink: 0; }\n\n    .about-vis { position: relative; z-index: 2; }\n    .about-photo-box {\n      background: var(--d2);\n      aspect-ratio: 4/3;\n      position: relative;\n      overflow: hidden;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n    }\n    /* grid texture */\n    .about-photo-box::before {\n      content: '';\n      position: absolute;\n      inset: 0;\n      background-image:\n        repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 44px),\n        repeating-linear-gradient(90deg, rgba(255,255,255,0.018) 0, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 44px);\n    }\n    /* strips */\n    .about-photo-box::after {\n      content: '';\n      position: absolute;\n      inset: 0;\n      background-image: repeating-linear-gradient(\n        90deg,\n        transparent 0px, transparent 72px,\n        rgba(0,0,0,0.14) 72px, rgba(0,0,0,0.14) 74px\n      );\n      z-index: 2;\n    }\n    .about-photo-lbl {\n      position: absolute;\n      bottom: 14px; left: 0; right: 0;\n      text-align: center;\n      font-size: 10px;\n      color: rgba(255,255,255,0.1);\n      letter-spacing: 0.16em;\n      font-weight: 600;\n      z-index: 3;\n    }\n    .about-callout {\n      position: absolute;\n      bottom: -20px; right: -20px;\n      background: var(--y);\n      padding: 20px 24px;\n      text-align: center;\n      z-index: 5;\n    }\n    .ac-num {\n      font-family: 'Oswald', sans-serif;\n      font-size: 48px;\n      font-weight: 700;\n      line-height: 1;\n      color: var(--blk);\n    }\n    .ac-lbl {\n      font-size: 10.5px;\n      font-weight: 700;\n      letter-spacing: 0.06em;\n      text-transform: uppercase;\n      color: rgba(0,0,0,0.62);\n      margin-top: 4px;\n      line-height: 1.45;\n    }\n\n    /* ──────────────── WSA ──────────────── */\n    .wsa {\n      position: relative;\n      background: var(--blk);\n      padding: 100px 80px;\n      border-top: 1px solid var(--rule);\n      overflow: hidden;\n    }\n    .wsa-inner {\n      position: relative;\n      z-index: 2;\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 100px;\n      align-items: start;\n    }\n    .wsa-ghost {\n      position: absolute;\n      font-family: 'Oswald', sans-serif;\n      font-weight: 700;\n      font-size: clamp(110px, 13vw, 190px);\n      text-transform: uppercase;\n      color: rgba(255,255,255,0.025);\n      pointer-events: none;\n      z-index: 1;\n      line-height: 1;\n      top: -10px;\n      right: -5px;\n      user-select: none;\n    }\n    .wsa-hl {\n      font-family: 'Oswald', sans-serif;\n      font-weight: 700;\n      font-size: clamp(44px, 5vw, 68px);\n      text-transform: uppercase;\n      line-height: 1.0;\n      color: var(--wh);\n    }\n    .wsa-hl em { font-style: normal; color: var(--y); }\n    .wsa-sub {\n      color: rgba(255,255,255,0.42);\n      font-size: 15.5px;\n      line-height: 1.72;\n      margin: 24px 0 36px;\n    }\n    .wsa-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 32px 44px;\n      padding-top: 8px;\n    }\n    .wsa-item { border-top: 2px solid var(--y); padding-top: 16px; }\n    .wsa-item h4 { color: var(--wh); font-size: 15px; font-weight: 600; margin-bottom: 8px; }\n    .wsa-item p  { color: rgba(255,255,255,0.38); font-size: 14px; line-height: 1.62; }\n\n    /* ──────────────── PRODUCTS ──────────────── */\n    .products {\n      padding: 100px 80px;\n      background: var(--d1);\n      border-top: 1px solid var(--rule);\n      position: relative;\n      overflow: hidden;\n    }\n    .section-head {\n      display: flex;\n      align-items: flex-end;\n      justify-content: space-between;\n      margin-bottom: 56px;\n      position: relative;\n      z-index: 2;\n    }\n    .pgrid {\n      display: grid;\n      grid-template-columns: repeat " class=\"soc\">f<\u002Fa>\n        <a href=\"#\" class=\"soc\">ig<\u002Fa>\n        <a href=\"#\" class=\"soc\">yt<\u002Fa>\n        <a href=\"#\" class=\"soc\">in<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <!-- ════ VERDIE CHAT BUBBLE ════ -->\n  <button id=\"verdie-bubble\" onclick=\"verdieToggle()\" aria-label=\"Chat with Verdie\">\n    <svg class=\"vb-icon\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\">\n      <path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\" stroke=\"#111\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n    <\u002Fsvg>\n    <span class=\"vb-close\">✕<\u002Fspan>\n  <\u002Fbutton>\n\n  <div id=\"verdie-win\">\n    <div class=\"vh\">\n      <div class=\"vh-av\">V<\u002Fdiv>\n      <div>\n        <div class=\"vh-name\">Verdie<\u002Fdiv>\n        <div class=\"vh-status\">A-Verdi Assistant<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"vm\" id=\"verdie-msgs\"><\u002Fdiv>\n    <div class=\"vi\">\n      <textarea id=\"verdie-input\" placeholder=\"Ask about storage, delivery, pricing…\" rows=\"1\"><\u002Ftextarea>\n      <button class=\"vi-send\" id=\"verdie-send\" aria-label=\"Send\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\">\n          <line x1=\"22\" y1=\"2\" x2=\"11\" y2=\"13\" stroke=\"#111\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fline>\n          <polygon points=\"22 2 15 22 11 13 2 9 22 2\" stroke=\"#111\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpolygon>\n        <\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <script>\n    /* ── Mobile menu toggle ── */\n    function toggleMobileMenu() {\n      var m = document.getElementById('mobileMenu');\n      var b = document.getElementById('navBurger');\n      var open = m.classList.toggle('open');\n      b.classList.toggle('open', open);\n      b.setAttribute('aria-expanded', open ? 'true' : 'false');\n    }\n    document.querySelectorAll('#mobileMenu a').forEach(function(a) {\n      a.addEventListener('click', function() {\n        document.getElementById('mobileMenu').classList.remove('open');\n        var b = document.getElementById('navBurger');\n        if (b) { b.classList.remove('open'); b.setAttribute('aria-expanded', 'false'); }\n      });\n    });\n\n    /* ── Premium micro-interactions ── */\n    (function () {\n      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n      var nav = document.querySelector('.nav');\n      var bar = document.getElementById('scrollProgress');\n      var ghosts = reduce ? [] : Array.prototype.slice.call(\n        document.querySelectorAll('.ap-ghost, .about-ghost, .wsa-ghost'));\n      var ticking = false;\n\n      function update() {\n        var y = window.pageYOffset || document.documentElement.scrollTop || 0;\n        if (nav) nav.classList.toggle('scrolled', y > 24);\n        if (bar) {\n          var h = (document.documentElement.scrollHeight - window.innerHeight) || 1;\n          bar.style.transform = 'scaleX(' + Math.min(Math.max(y / h, 0), 1) + ')';\n        }\n        if (ghosts.length) {\n          var vh = window.innerHeight;\n          for (var i = 0; i < ghosts.length; i++) {\n            var r = ghosts[i].getBoundingClientRect();\n            var d = (r.top + r.height / 2) - vh / 2;\n            ghosts[i].style.transform = 'translateY(' + (d * -0.07).toFixed(1) + 'px)';\n          }\n        }\n        ticking = false;\n      }\n      function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }\n      window.addEventListener('scroll', onScroll, { passive: true });\n      window.addEventListener('resize', onScroll, { passive: true });\n      update();\n\n      /* Count-up for the years stat */\n      var stat = document.querySelector('.ac-num');\n      if (stat && !reduce) {\n        var raw = stat.textContent.trim();\n        var target = parseInt(raw, 10);\n        var suffix = raw.replace(/[0-9]/g, '');\n        if (!isNaN(target)) {\n          var seen = false;\n          var so = new IntersectionObserver(function (entries) {\n            entries.forEach(function (e) {\n              if (e.isIntersecting && !seen) {\n                seen = true;\n                var start = null, dur = 1300;\n                function step(ts) {\n                  if (!start) start = ts;\n                  var p = Math.min((ts - start) / dur, 1);\n                  var eased = 1 - Math.pow(1 - p, 3);\n                  stat.textContent = Math.round(eased * target) + (p === 1 ? suffix : '');\n                  if (p < 1) requestAnimationFrame(step);\n                }\n                requestAnimationFrame(step);\n                so.unobserve(e.target);\n              }\n            });\n          }, { threshold: 0.5 });\n          so.observe(stat);\n        }\n      }\n    })();\n\n    /* ── Scroll animations ── */\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach(e => {\n        if (e.isIntersecting) { e.target.classList.add('in-view'); io.unobserve(e.target); }\n      });\n    }, { threshold: 0.1, rootMargin: '0px 0px -48px 0px' });\n    document.querySelectorAll('[data-anim],[data-stagger]').forEach(el => io.observe(el));\n\n    // Hero card is always visible; trigger scroll items already in view\n    setTimeout(() => {\n      document.querySelectorAll('[data-anim],[data-stagger]').forEach(el => io.observe(el));\n    }, 50);\n\n    /* ── Verdie Chat ── */\n    function verdieToggle() {\n      const win = document.getElementById('verdie-win');\n      const btn = document.getElementById('verdie-bubble');\n      const open = win.classList.toggle('open');\n      btn.classList.toggle('open', open);\n      if (open && document.getElementById('verdie-msgs').children.length === 0) {\n        verdieAdd('ai', \"Hi! I\\u2019m Verdie, A-Verdi\\u2019s assistant. Ask me anything about our storage containers, van trailers, portable offices, or delivery options!\");\n      }\n      if (open) setTimeout(() => document.getElementById('verdie-input').focus(), 280);\n    }\n\n    (function() {\n      const API    = '/wp-json/chatbot/v1/claude';\n      const msgsEl = document.getElementById('verdie-msgs');\n      const inp    = document.getElementById('verdie-input');\n      const snd    = document.getElementById('verdie-send');\n\n      inp.addEventListener('input', () => {\n        inp.style.height = 'auto';\n        inp.style.height = Math.min(inp.scrollHeight, 90) + 'px';\n      });\n      inp.addEventListener('keydown', e => {\n        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); }\n      });\n      snd.addEventListener('click', go);\n\n      function go() {\n        const q = inp.value.trim();\n        if (!q) return;\n        verdieAdd('user', q);\n        inp.value = ''; inp.style.height = 'auto';\n        snd.disabled = true;\n        const t = think();\n        fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({question:q}) })\n          .then(r => r.json())\n          .then(d => { t.rm(); verdieAdd('ai', d.response || d.error || 'Unexpected response.'); })\n          .catch(() => { t.rm(); verdieAdd('ai', 'Could not connect. Please call us at 800-248-3734.'); })\n          .finally(() => { snd.disabled = false; inp.focus(); });\n      }\n\n      function think() {\n        const el = document.createElement('div');\n        el.className = 'vthink';\n        el.innerHTML = '<div class=\"vdots\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv><span>Thinking\\u2026<\u002Fspan>';\n        msgsEl.appendChild(el);\n        msgsEl.scrollTop = msgsEl.scrollHeight;\n        return { rm: () => el.remove() };\n      }\n\n      window.verdieAdd = function(role, text) {\n        const w = document.createElement('div'); w.className = 'vmsg ' + role;\n        const l = document.createElement('div'); l.className = 'vmsg-lbl'; l.textContent = role === 'user' ? 'You' : 'Verdie';\n        const b = document.createElement('div'); b.className = 'vmsg-bub';\n        b.innerHTML = text.replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;')\n          .replace(/\\[([^\\]]+)\\]\\((https?:\\/\\/[^)]+)\\)/g,'<a href=\"$1\" target=\"_blank\">$2<\u002Fa>')\n          .replace(/\\*\\*([^*]+)\\*\\*/g,'<strong>$1<\u002Fstrong>').replace(/\\n/g,'<br>');\n        w.appendChild(l); w.appendChild(b); msgsEl.appendChild(w);\n        msgsEl.scrollTop = msgsEl.scrollHeight;\n      };\n    })();\n\n\n  <\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
